/* Layout: one narrow column built for a phone held between sets; sticky tab bar on top, rest timer and finish button pinned to the bottom. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --sunken: #e3e6e0;
  --ink: #15181b;
  --muted: #5a6168;
  --line: #d3d7cf;
  --accent: #2443c4;
  --accent-ink: #ffffff;
  --accent-soft: #dfe5fb;
  --good: #1b7543;
  --good-soft: #dcefe3;
  --warn: #8a5a00;
  --warn-soft: #f6ead0;
  --danger: #b3261e;
  --fig-skin: #ece6de; --fig-outline: #a89e93; --fig-hair: #6b5f55; --fig-line: #b9beb5;
  --st-good-fill: #7fc79c; --st-good-ink: #0a3d21;
  --st-ok-fill: #aab0a8;   --st-ok-ink: #1d2226;
  --st-bad-fill: #ea9a90;  --st-bad-ink: #65110b;
  --st-none-fill: #d6d9d2; --st-none-ink: #5a6168;
  --gl: 42%;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1a1d20; --sunken: #23272b; --ink: #eceee8; --muted: #9da4aa;
    --line: #30353a; --accent: #8aa2ff; --accent-ink: #0c1024; --accent-soft: #232b4d;
    --good: #67d095; --good-soft: #17301f; --warn: #e6b450; --warn-soft: #34290f; --danger: #ff8a80;
    --fig-skin: #3b4046; --fig-outline: #66707a; --fig-hair: #20242a; --fig-line: #41474d;
    --st-good-fill: #2f7d50; --st-good-ink: #e3ffee;
    --st-ok-fill: #626b74;   --st-ok-ink: #f1f3f5;
    --st-bad-fill: #93403a;  --st-bad-ink: #ffe7e3;
    --st-none-fill: #2a2f34; --st-none-ink: #9da4aa;
    --gl: 66%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1a1d20; --sunken: #23272b; --ink: #eceee8; --muted: #9da4aa;
  --line: #30353a; --accent: #8aa2ff; --accent-ink: #0c1024; --accent-soft: #232b4d;
  --good: #67d095; --good-soft: #17301f; --warn: #e6b450; --warn-soft: #34290f; --danger: #ff8a80;
  --fig-skin: #3b4046; --fig-outline: #66707a; --fig-hair: #20242a; --fig-line: #41474d;
  --st-good-fill: #2f7d50; --st-good-ink: #e3ffee;
  --st-ok-fill: #626b74;   --st-ok-ink: #f1f3f5;
  --st-bad-fill: #93403a;  --st-bad-ink: #ffe7e3;
  --st-none-fill: #2a2f34; --st-none-ink: #9da4aa;
  --gl: 66%;
  color-scheme: dark;
}

// Front view lives in x 0–724, back view in x 724–1448 (shapes from bodydata.js).
const SLUG_TO_GROUP = {
  front: { chest: "chest", deltoids: "shoulders", biceps: "biceps", triceps: "triceps", forearm: "forearms", abs: "abs", obliques: "abs", quadriceps: "quads", calves: "calves", trapezius: "traps" },
  back: { trapezius: "traps", deltoids: "shoulders", "upper-back": "back", "lower-back": "lowerback", triceps: "triceps", forearm: "forearms", gluteal: "glutes", hamstring: "hamstrings", calves: "calves" },
};
const VIEW_CX = { front: 362, back: 1086 };
// Each group is labelled in one view only, so numbers never collide.
const LABEL_VIEW = { chest: "front", shoulders: "front", biceps: "front", forearms: "front", abs: "front", quads: "front", traps: "back", back: "back", triceps: "back", lowerback: "back", glutes: "back", hamstrings: "back", calves: "back" };
const MIDLINE = new Set(["traps", "lowerback", "abs"]);
const shortPct = pct => pct == null ? "" : (pct > 0.5 ? "+" : pct < -0.5 ? "−" : "") + Math.abs(Math.round(pct));

/** groups: { muscle: { pct } }. opts: build, color (hair colour for the social view), labels, interactive */
function figureSVG(groups, { build = 1, color = null, labels = true, interactive = false, title = "" } = {}) {
  const view = key => {
    const cx = VIEW_CX[key];
    let out = `<g transform="translate(${cx} 0) scale(${build} 1) translate(${-cx} 0)">`;
    out += `<path class="silhouette" d="${BODY_OUTLINE[key]}"/>`;
    const byGroup = {};
    for (const part of BODY[key]) {
      const g = SLUG_TO_GROUP[key][part.slug];
      if (!g) {
        const cls = part.slug === "hair" ? "hair" : "skin";
        const fill = part.slug === "hair" && color ? ` style="fill:${esc(color)}"` : "";
        out += part.paths.map(d => `<path class="${cls}"${fill} d="${d}"/>`).join("");
      } else (byGroup[g] || (byGroup[g] = [])).push(...part.paths);
    }
    for (const [g, paths] of Object.entries(byGroup)) {
      const pct = groups[g]?.pct ?? null, st = statusOf(pct);
      const aria = `${MUSCLES[g].name}: ${pctText(pct)}`;
      out += `<g class="mg${interactive ? " hit" : ""}" data-g="${g}" data-view="${key}" ${labels && pct != null && LABEL_VIEW[g] === key ? `data-label="${shortPct(pct)}" data-st="${st}"` : ""} ${interactive ? `tabindex="0" role="button" aria-label="${aria}"` : ""}><title>${aria}</title>`;
      out += paths.map(d => `<path class="m ${st}" d="${d}"/>`).join("") + `</g>`;
    }
    return out + `</g><text class="cap" x="${cx}" y="1395">${key === "front" ? "Forfra" : "Bakfra"}</text>`;
  };
  return `<svg class="figure" viewBox="0 80 1448 1340" role="${interactive ? "group" : "img"}" aria-label="${esc(title || "Muskelkart")}">${view("front")}${view("back")}</svg>`;
}
// Labels go in after the figure is on the page, centred on the left-hand muscle of each pair.
function placeLabels(root = document) {
  root.querySelectorAll("svg.figure g.mg[data-label]").forEach(g => {
    if (g.dataset.placed) return; g.dataset.placed = "1";
    const cx = VIEW_CX[g.dataset.view];
    let boxes = [...g.querySelectorAll("path")].map(p => p.getBBox()).filter(b => b.width);
    if (!boxes.length) return;
    const left = boxes.filter(b => b.x + b.width / 2 < cx - 4);
    if (left.length && !MIDLINE.has(g.dataset.g)) boxes = left;
    const x0 = Math.min(...boxes.map(b => b.x)), x1 = Math.max(...boxes.map(b => b.x + b.width));
    const y0 = Math.min(...boxes.map(b => b.y)), y1 = Math.max(...boxes.map(b => b.y + b.height));
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", (x0 + x1) / 2); t.setAttribute("y", (y0 + y1) / 2);
    t.setAttribute("class", "lbl " + g.dataset.st); t.textContent = g.dataset.label;
    g.parentNode.appendChild(t);
  });
}

const CARDIO = {

  bike:    { name: "Sykling ute", noun: "sykkeltur", unit: "km", show: "speed", elev: true, hue: 200 },
  spin:    { name: "Spinning", noun: "spinningøkt", unit: "km", show: "speed", distOptional: true, hue: 280 },
  incline: { name: "Incline walking", noun: "incline walking-økt", unit: "km", show: "pace", incline: true, hue: 135 },
  swim:    { name: "Svømming", noun: "svømmeøkt", unit: "m", show: "pace100", hue: 50 },
};
const CARDIO_ORDER = Object.keys(CARDIO);
const cardioColor = a => `hsl(${CARDIO[a]?.hue ?? 0} 60% var(--gl))`;
const CTYPES = [["rolig", "Rolig"], ["intervall", "Intervall"], ["langtur", "Langtur"]];
const isCardio = s => s?.kind === "cardio";

function parseDur(v) {
  if (v == null || v === "") return null;
  const str = String(v).trim().replace(",", ".");
  if (str.includes(":")) {
    const parts = str.split(":").map(Number); if (parts.some(x => !isFinite(x))) return null;
    return parts.length === 3 ? parts[0] * 3600 + parts[1] * 60 + parts[2] : parts[0] * 60 + parts[1];
  }
  const m = parseFloat(str); return isFinite(m) ? Math.round(m * 60) : null;
}
function fmtDur(sec) {
  if (sec == null) return "";
  sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
const kmOf = s => { const c = s.cardio || {}, d = num(c.dist); if (d == null) return null; return CARDIO[s.activity]?.unit === "m" ? d / 1000 : d; };
function cStats(s) {
  const c = s.cardio || {}, sec = num(c.sec), d = num(c.dist), a = CARDIO[s.activity] || {};
  const out = { sec, dist: d, km: kmOf(s) };
  if (sec && d) {
    if (a.show === "speed") out.speed = d / (sec / 3600);
    if (a.show === "pace") out.pace = sec / d;
    if (a.show === "pace100") out.pace = sec / (d / 100);
  }
  return out;
}
function cMetric(s) {
  const st = cStats(s), a = CARDIO[s.activity] || {};
  if (st.speed) return `${fmt(Math.round(st.speed * 10) / 10)} ${LANG === "en" ? "km/h" : "km/t"}`;
  if (st.pace) return `${fmtDur(st.pace)} ${a.show === "pace100" ? "/100 m" : "/km"}`;
  return "";
}
function cSummary(s) {
  const st = cStats(s), a = CARDIO[s.activity] || {};
  return [st.dist != null ? `${fmt(st.dist)} ${a.unit}` : "", st.sec ? fmtDur(st.sec) : "", cMetric(s)].filter(Boolean).join(" · ");
}
const cardioSessions = uid => sessionsOf(uid).filter(s => isCardio(s) && num(s.cardio?.sec));

// Cardio records: each beats every earlier session of the same activity.
const CARDIO_RECORDS = [
  { id: "longest", acts: ["run", "bike", "spin", "incline", "swim"], val: s => cStats(s).dist, better: (a, b) => a > b, label: (s, a) => `${LANG === "en" ? "longest" : "lengste"} ${CARDIO[a].noun} (${fmt(cStats(s).dist)} ${CARDIO[a].unit})` },
  { id: "pace", acts: ["run"], val: s => (cStats(s).dist >= 3 ? cStats(s).pace : null), better: (a, b) => a < b, label: s => `${LANG === "en" ? "fastest running pace" : "raskeste løpetempo"} (${fmtDur(cStats(s).pace)} /km)` },
  { id: "speed", acts: ["bike"], val: s => (cStats(s).dist >= 10 ? cStats(s).speed : null), better: (a, b) => a > b, label: s => `${LANG === "en" ? "highest average cycling speed" : "høyeste snittfart på sykkel"} (${fmt(Math.round(cStats(s).speed * 10) / 10)} ${LANG === "en" ? "km/h" : "km/t"})` },
];
function cardioRecordsOf(uid) {
  const out = [], best = {};
  for (const s of [...cardioSessions(uid)].reverse()) {
    for (const r of CARDIO_RECORDS) {
      if (!r.acts.includes(s.activity)) continue;
      const v = r.val(s); if (v == null || !v) continue;
      const k = r.id + ":" + s.activity;
      if (best[k] != null && r.better(v, best[k])) out.push({ uid, sid: s.id, date: s.date, key: `${uid}~${s.id}~c_${r.id}`, label: r.label(s, s.activity), cardio: true });
      if (best[k] == null || r.better(v, best[k])) best[k] = v;
    }
  }
  return out;
}
function cardioBest(uid, act) {
  const list = cardioSessions(uid).filter(s => s.activity === act); if (!list.length) return null;
  const longest = list.reduce((a, s) => ((cStats(s).dist || 0) > (cStats(a).dist || 0) ? s : a));
  const withM = list.filter(s => (CARDIO[act].show === "speed" ? cStats(s).speed : cStats(s).pace));
  const fastest = withM.length ? withM.reduce((a, s) => (CARDIO[act].show === "speed" ? cStats(s).speed > cStats(a).speed : cStats(s).pace < cStats(a).pace) ? s : a) : null;
  return { n: list.length, longest, fastest };
}

  const by = {}; let total = 0;
  cardioSessions(uid).filter(s => s.date >= from && s.date <= to).forEach(s => { const k = kmOf(s); if (k) { by[s.activity] = (by[s.activity] || 0) + k; total += k; } });

function weeklyKmSVG(uid, weeks = 12) {

  for (let i = weeks - 1; i >= 0; i--) { const ws = addDays(start, -7 * i); rows.push({ ws, ...kmInRange(uid, ws, addDays(ws, 6)) }); }
  const acts = CARDIO_ORDER.filter(a => rows.some(r => r.by[a]));
  const W = 520, H = 200, L = 36, Rr = 8, T = 10, Bt = 28, max = Math.max(5, ...rows.map(r => r.total));
  const nice = Math.ceil(max / 5) * 5, bw = (W - L - Rr) / weeks;

  [0, .5, 1].forEach(f => { const v = nice * f; svg += `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v)}</text>`; });
  rows.forEach((r, i) => {
    let y = Y(0); const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    acts.forEach(a => { const k = r.by[a] || 0; if (!k) return; const h = Y(0) - Y(k); y -= h; svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${cardioColor(a)}"><title>${CARDIO[a].name}: ${fmt(Math.round(k * 10) / 10)} km</title></rect>`; });
    if (i % 3 === 0 || i === weeks - 1) svg += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${i === weeks - 1 ? (LANG === "en" ? "Now" : "Nå") : (LANG === "en" ? "w" : "u") + weekNo(r.ws)}</text>`;
  });

  const table = `<details class="small"><summary>${LANG === "en" ? "Show as table" : "Vis som tabell"}</summary><div class="tbl-wrap"><table><thead><tr><th>${LANG === "en" ? "Week" : "Uke"}</th>${acts.map(a => `<th>${CARDIO[a].name}</th>`).join("")}<th>${LANG === "en" ? "Total" : "Sum"}</th></tr></thead><tbody>${[...rows].reverse().map(r => `<tr><td class="num">${weekNo(r.ws)}</td>${acts.map(a => `<td class="num">${r.by[a] ? fmt(Math.round(r.by[a] * 10) / 10) : "–"}</td>`).join("")}<td class="num">${fmt(Math.round(r.total * 10) / 10)}</td></tr>`).join("")}</tbody></table></div></details>`;
  const legend = `<div class="legend">${acts.map(a => `<span><i style="background:${cardioColor(a)}"></i>${CARDIO[a].name}</span>`).join("")}</div>`;
  return svg + legend + table;
}

function trText(s) {
  if (LANG !== "en" || !s) return s;

// ---------- demo data: invented people, generated on first visit ----------
function buildDemoData() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const BASE = { smith_incline: 50, dips_seated: 50, cable_fly: 15, tri_push_1arm: 10, tri_oh_1arm: 8, pulldown: 55, seated_row: 50, face_pull: 20, lat_raise: 6, ohp: 35, shrug_db: 24, bicep_1arm: 8, hammer_rope: 20, leg_press: 120, leg_curl: 40, leg_ext: 45, calf_seated: 40, calf_standing: 50, cable_crunch: 45 };
  const people = [
    { uid: "demo-you", name: "Deg", color: PERSON_COLORS[0], build: 1, f: 1, g: 0.012, plan: ["push", "pull", "legs"], skip: [] },
    { uid: "demo-ola", name: "Ola", color: PERSON_COLORS[1], build: 1.1, f: 1.2, g: 0.008, plan: ["upper", "lower"], skip: [6] },
    { uid: "demo-kari", name: "Kari", color: PERSON_COLORS[2], build: 0.9, f: 0.75, g: 0.016, plan: ["push", "pull", "legs"], skip: [3] },
    { uid: "demo-even", name: "Even", color: PERSON_COLORS[3], build: 1, f: 0.95, g: 0.006, plan: ["upper", "lower"], skip: [9, 10] },
  ];
  const profiles = {}, sessions = {};
  const today = todayISO(), start = addDays(weekStart(today), -7 * 11);
  for (const p of people) {
    profiles[p.uid] = { name: p.name, color: p.color, build: p.build, owner: p.uid === "demo-you", templates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)), custom: {}, createdAt: start };
    const list = []; let k = 0;
    for (let w = 0; w < 12; w++) {
      if (p.skip.includes(w)) continue;
      const days = [0, 2, 4, 5].filter(() => rnd() < 0.8).slice(0, 2 + Math.round(rnd() * 2));
      for (const d of days) {
        const date = addDays(start, w * 7 + d); if (date >= today) continue;
        const key = p.plan[k++ % p.plan.length], t = DEFAULT_TEMPLATES.find(x => x.key === key);
        const exercises = t.ex.map(id => {
          const m = CAT[id], [lo, hi] = m.range;
          if (m.bw) { const reps = Math.round(6 + w * 0.35 * p.f + rnd() * 2); return { id, closed: true, sets: [0, 1, 2].map(i => ({ kg: 0, reps: Math.max(3, reps - i), done: true })) }; }
          const kg = Math.max(m.inc, Math.round(BASE[id] * p.f * (1 + p.g * w + (rnd() - 0.5) * 0.04) / m.inc) * m.inc);
          return { id, closed: true, sets: [0, 1, 2].map(i => ({ kg, reps: Math.max(lo, Math.min(hi, Math.round(lo + (hi - lo) * rnd()) - i)), done: true })) };
        });
        list.push({ id: `${date}-${key}-${p.uid.slice(5)}${w}${d}`, date, template: key, templateName: t.name, startedAt: date + "T17:00:00.000Z", finishedAt: date + "T18:10:00.000Z", note: "", exercises });
      }
    }
    // cardio: [activity, day of week, base distance, base pace (sec per km, or per 100 m for swimming)]
    const plan = { "demo-you": [["incline", 1, 3.4, 640], ["incline", 6, 3.6, 630]], "demo-ola": [["run", 1, 6, 330], ["run", 6, 10, 345]], "demo-kari": [["bike", 3, 30, 130], ["spin", 6, 18, 140]], "demo-even": [["run", 3, 5, 360], ["swim", 6, 1200, 140]] }[p.uid] || [];
    for (let w = 0; w < 12; w++) for (const [act, d, dist0, pace0] of plan) {
      const date = addDays(start, w * 7 + d); if (date >= today || rnd() < 0.15) continue;
      const long = act === "run" && d === 6, unitM = CARDIO[act].unit === "m";
      const dist = unitM ? Math.round((dist0 + w * 50) / 50) * 50 : Math.round((dist0 * (1 + w * 0.02) + (rnd() - 0.5) * (long ? 2 : 0.6)) * 10) / 10;
      const pace = pace0 * (1 - w * 0.006) * (1 + (rnd() - 0.5) * 0.04);
      const sec = Math.round(unitM ? pace * dist / 100 : pace * dist);
      list.push({ id: `${date}-${act}-${p.uid.slice(5)}${w}`, kind: "cardio", activity: act, template: "c_" + act, templateName: CARDIO[act].name, date, startedAt: date + "T07:00:00.000Z", finishedAt: date + "T08:00:00.000Z", note: "",
        cardio: { sec, dist, hr: Math.round(135 + rnd() * 20), elev: CARDIO[act].elev ? Math.round(dist * 8) : null, incline: act === "incline" ? 12 : null, type: long ? "langtur" : (act === "run" && w % 3 === 2 ? "intervall" : "rolig"), rpe: 4 + Math.round(rnd() * 3), iv: { n: null, len: null, pause: null } } });
    }
    sessions[p.uid] = sortSessions(list);
  }
  S.profiles = profiles; S.sessions = sessions;
  const reactions = {};
  const others = people.map(p => p.uid);
  others.forEach(uid => allRecordsOf(uid).slice(-6).forEach((r, i) => {
    others.filter(u => u !== uid && u !== "demo-you").forEach((u, j) => {
      if ((i + j) % 2) return; (reactions[u] || (reactions[u] = { r: {} })).r[r.key] = REACTIONS[(i + j) % REACTIONS.length];
    });
  }));
  const body = { entries: {} };
  for (let w = 0; w < 12; w++) { const d = addDays(start, w * 7); if (d < today) body.entries[d] = { kg: Math.round((75 + w * 0.18 + (rnd() - 0.5) * 0.6) * 10) / 10, waist: w % 2 ? null : Math.round((80 + w * 0.05) * 10) / 10 }; }
  const ym = prevMonth(today.slice(0, 7));
  const notes = { [`demo-you_${ym}`]: { text: "Eksempel: Jevn måned. Bryst og skuldre går mest fremover. Leggene har stått stille i tre uker, så prøv 2,5 kg mer på stående leggløft.", text_en: "Example: A steady month. Chest and shoulders improved the most. Calves have not moved in three weeks, so try 2.5 kg more on standing calf raises." } };
  return { profiles, sessions, reactions, notes, body };
}

function newExercise(exId) {

function closeExercise(e) {

  e.sets = e.sets.filter(s => s.done);

}

async function deleteSession(id) {

  armed = null; render();
}
function placeholderFor(e, j, prevSets) {
  if (prevSets[j]) return prevSets[j];
  const locked = e.sets.slice(0, j).filter(s => s.done);
  return locked[locked.length - 1] || prevSets[prevSets.length - 1] || null;
}
function hintFor(exId) {
  const p = previousFor(exId, draft?.id); if (!p) return "";
  const m = exMeta(S.me, exId), ds = doneSets(p.ex), top = m.range[1];
  if (ds.length && ds.every(s => num(s.reps) >= top))
    return m.bw && ds.every(s => !num(s.kg)) ? `Alle sett nådde ${top} reps sist. Legg på vekt eller ta en tyngre variant.` : `Alle sett nådde ${top} reps sist. Prøv +${fmt(m.inc)} kg.`;

}

  v.innerHTML = `

function exCard(e, i) {

// ---------- charts ----------
function sparkSVG(pts, w = 84, h = 28, color = "var(--accent)") {
  if (pts.length < 2) return "";
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), r = hi - lo || 1;
  const xy = pts.map((p, i) => [i / (pts.length - 1) * (w - 6) + 3, h - 4 - (p.v - lo) / r * (h - 8)]);
  const [lx, ly] = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
function chartSVG(pts, color = "var(--accent)", tickFmt = v => fmt(Math.round(v * 10) / 10)) {
  const W = 520, H = 220, L = 44, Rr = 14, T = 14, Bt = 30;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * 0.15 || Math.max(1, hi * 0.05); lo = Math.max(0, lo - pad); hi = hi + pad;
  const t0 = new Date(pts[0].date).getTime(), t1 = new Date(pts[pts.length - 1].date).getTime(), tr = t1 - t0 || 1;
  const X = p => pts.length === 1 ? (L + W - Rr) / 2 : L + (new Date(p.date).getTime() - t0) / tr * (W - L - Rr);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - Bt);
  const ticks = [0, 1, 2, 3].map(i => lo + (hi - lo) * i / 3);
  const line = pts.map(p => `${X(p).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Utvikling over tid">
    ${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${tickFmt(v)}</text>`).join("")}
    ${pts.length > 1 ? `<polygon points="${X(pts[0]).toFixed(1)},${H - Bt} ${line} ${X(last).toFixed(1)},${H - Bt}" fill="${color}" opacity=".12"/>` : ""}
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--surface)" stroke="${color}" stroke-width="2"/>`).join("")}
    <circle cx="${X(last).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="5" fill="${color}"/>
    <text x="${L}" y="${H - 8}" font-size="12" fill="var(--muted)">${dateLabel(pts[0].date, { day: "numeric", month: "short" })}</text>
    ${pts.length > 1 ? `<text x="${W - Rr}" y="${H - 8}" font-size="12" fill="var(--muted)" text-anchor="end">${dateLabel(last.date, { day: "numeric", month: "short" })}</text>` : ""}
  </svg>`;
}

    </div>
    <h2>Øvelser</h2>
    ${t.ex.length ? `<div class="list">${t.ex.map((id, i) => { const m = exMeta(S.me, id); return `
      <div class="row"><span class="main"><b>${esc(m.name)}</b><span class="small muted">${MUSCLES[m.primary]?.name || "Ukjent muskel"}${(m.secondary || []).length ? " + " + m.secondary.map(g => MUSCLES[g]?.name).join(", ") : ""}</span></span>
      <span style="display:flex;gap:6px"><button class="iconbtn" data-up="${i}" aria-label="Flytt ${esc(m.name)} opp" ${i === 0 ? "disabled" : ""}>↑</button><button class="iconbtn" data-down="${i}" aria-label="Flytt ${esc(m.name)} ned" ${i === t.ex.length - 1 ? "disabled" : ""}>↓</button><button class="iconbtn" data-rm="${i}" aria-label="Fjern ${esc(m.name)}">✕</button></span></div>`; }).join("")}</div>`
      : `<div class="empty">Ingen øvelser ennå. Søk opp øvelser under.</div>`}
    <h2>Legg til øvelse</h2>
    <div class="card">
      <label class="fl" for="exsearch">Søk<input class="input" id="exsearch" placeholder="f.eks. benk, roing, curl" autocomplete="off"></label>
      <div class="results" id="results"></div>
      <button class="btn ghost" id="togglecustom" aria-expanded="${customOpen}">${customOpen ? "Skjul egen øvelse" : "Finner du den ikke? Lag egen øvelse"}</button>
      <form class="form" id="customform" ${customOpen ? "" : "hidden"} style="border:0;padding:0">
        <label for="c-name">Navn på øvelsen<input id="c-name" maxlength="40"></label>
        <label for="c-primary">Hovedmuskel<select id="c-primary">${MUSCLE_ORDER.map(g => `<option value="${g}">${MUSCLES[g].name}</option>`).join("")}</select></label>
        <label for="c-sec">Sekundærmuskel (valgfritt)<select id="c-sec"><option value="">Ingen</option>${MUSCLE_ORDER.map(g => `<option value="${g}">${MUSCLES[g].name}</option>`).join("")}</select></label>
        <div class="grid"><label for="c-lo">Reps fra<input id="c-lo" inputmode="numeric" value="8"></label><label for="c-hi">Reps til<input id="c-hi" inputmode="numeric" value="12"></label></div>
        <div class="check-row"><label><input type="checkbox" id="c-arm"> Vekt per arm</label><label><input type="checkbox" id="c-bw"> Kroppsvekt</label></div>
        <button class="btn" type="submit">Lag og legg til</button>
      </form>
    </div>
    <div class="ex-actions" style="margin-top:16px">
      <button class="btn primary" id="savetpl">Lagre økt</button>
      ${t.isNew ? "" : `<button class="btn danger ${armed === "tpl" ? "armed" : ""}" id="deltpl">${armed === "tpl" ? "Trykk igjen for å slette" : "Slett økt"}</button>`}
    </div>`;
  const sync = () => { t.name = $("#tpl-name").value; t.warmup = $("#tpl-warm").value; };
  $("#back").onclick = () => { tplDraft = null; back(); };
  v.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { sync(); const i = +b.dataset.up; [t.ex[i - 1], t.ex[i]] = [t.ex[i], t.ex[i - 1]]; render(); });
  v.querySelectorAll("[data-down]").forEach(b => b.onclick = () => { sync(); const i = +b.dataset.down; [t.ex[i + 1], t.ex[i]] = [t.ex[i], t.ex[i + 1]]; render(); });
  v.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { sync(); t.ex.splice(+b.dataset.rm, 1); render(); });
  const showResults = () => {
    const qv = $("#exsearch").value.trim().toLowerCase();
    const list = allExercises().filter(([k, m]) => !t.ex.includes(k) && (!qv || m.name.toLowerCase().includes(qv) || (MUSCLES[m.primary]?.name || "").toLowerCase().includes(qv))).slice(0, qv ? 12 : 0);
    $("#results").innerHTML = list.map(([k, m]) => `<button class="btn" data-add="${esc(k)}">+ ${esc(m.name)} <span class="muted small">· ${MUSCLES[m.primary]?.name || ""}</span></button>`).join("") || (qv ? `<p class="small muted" style="margin:0">Ingen treff.</p>` : "");
    translateDOM($("#results"));
    $("#results").querySelectorAll("[data-add]").forEach(b => b.onclick = () => { sync(); t.ex.push(b.dataset.add); render(); $("#exsearch").focus(); });
  };
  $("#exsearch").oninput = showResults;
  $("#togglecustom").onclick = () => { sync(); customOpen = !customOpen; render(); if (customOpen) $("#c-name").focus(); };
  $("#customform").onsubmit = async ev => {
    ev.preventDefault(); sync();
    const name = $("#c-name").value.trim(); if (!name) { $("#c-name").focus(); return; }
    const lo = Math.max(1, parseInt($("#c-lo").value) || 8), hi = Math.max(lo, parseInt($("#c-hi").value) || 12);
    const primary = $("#c-primary").value, sec = $("#c-sec").value;
    const id = "c_" + rid();
    const p = myProfile();
    const custom = { ...(p.custom || {}), [id]: { name, primary, secondary: sec && sec !== primary ? [sec] : [], range: [lo, hi], inc: 2.5, perArm: $("#c-arm").checked, bw: $("#c-bw").checked } };
    await B.saveProfile({ ...p, custom });
    S.profiles[S.me] = { ...p, custom };
    t.ex.push(id); customOpen = false; render(); toast(`${name} er lagt til`);
  };
  $("#savetpl").onclick = async () => {
    sync(); if (!t.name.trim()) { $("#tpl-name").focus(); return; }
    const p = myProfile(); const { isNew, ...clean } = t; clean.name = clean.name.trim(); clean.warmup = (clean.warmup || "").trim();
    const templates = isNew ? [...p.templates, clean] : p.templates.map(x => x.key === clean.key ? clean : x);
    await B.saveProfile({ ...p, templates }); tplDraft = null; toast("Økta er lagret"); back();
  };
  const del = $("#deltpl");
  if (del) del.onclick = async () => {
    if (armed !== "tpl") { armed = "tpl"; sync(); render(); setTimeout(() => { if (armed === "tpl") { armed = null; if (nav?.v === "tpl") render(); } }, 4000); return; }
    armed = null; const p = myProfile();
    await B.saveProfile({ ...p, templates: p.templates.filter(x => x.key !== t.key) }); tplDraft = null; toast("Økta er slettet"); back();
  };
}

// ---------- social ----------
function people() { return Object.keys(S.profiles).sort((a, b) => (a === S.me ? -1 : b === S.me ? 1 : nameOf(a).localeCompare(nameOf(b), "nb"))); }
function renderSocial(v) {
  const ids = people();
  const ws = weekStart(todayISO());
  const week = ids.map(uid => { const list = countedSessions(uid).filter(s => s.date >= ws); const c = list.filter(isCardio).length; return { uid, n: list.length, c, st: list.length - c }; }).sort((a, b) => b.n - a.n);
  const maxN = Math.max(4, ...week.map(x => x.n));
  const ym = todayISO().slice(0, 7), mr = monthRange(ym);
  const kms = ids.map(uid => ({ uid, ...kmInRange(uid, mr[0], mr[1]) })).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  const maxKm = Math.max(10, ...kms.map(x => x.total));
  const since = addDays(todayISO(), -45);
  const feed = ids.flatMap(uid => allRecordsOf(uid)).filter(r => r.date >= since).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 25);
  const reactCounts = key => { const out = {}; Object.entries(S.reactions).forEach(([u, d]) => { const e = d?.r?.[key]; if (e) (out[e] || (out[e] = [])).push(u); }); return out; };
  v.innerHTML = `
    <h2>Denne uken</h2>
    <div class="card"><div class="bars">${week.map(({ uid, n, st, c }) => `
      <div class="bar-row"><span class="name"><span class="dot" style="background:${esc(colorOf(uid))}"></span>${esc(nameOf(uid))}</span>
      <div class="bar-track" role="img" aria-label="${esc(nameOf(uid))}: ${st} styrkeøkter og ${c} kondisjonsøkter denne uken" style="display:flex"><div class="bar-fill" style="width:${st / maxN * 100}%;background:${esc(colorOf(uid))};border-radius:6px 0 0 6px"></div><div class="bar-fill" style="width:${c / maxN * 100}%;background:${esc(colorOf(uid))};opacity:.45;border-radius:0 6px 6px 0"></div></div><span class="num" style="font-weight:700;text-align:right">${n}</span></div>`).join("")}</div>
      <span class="small muted">Antall økter siden mandag. Mørk del er styrke, lys del er kondisjon.</span></div>
    ${kms.length ? `<h2>Kilometer i ${new Date(ym + "-15T12:00:00").toLocaleDateString(LOCALE(), { month: "long" })}</h2>
    <div class="card"><div class="bars">${kms.map(({ uid, total, by }) => `
      <div class="bar-row" style="grid-template-columns:minmax(70px,110px) 1fr 52px"><span class="name"><span class="dot" style="background:${esc(colorOf(uid))}"></span>${esc(nameOf(uid))}</span>
      <div class="bar-track" role="img" aria-label="${esc(nameOf(uid))}: ${fmt(Math.round(total))} km" style="display:flex">${CARDIO_ORDER.filter(a => by[a]).map(a => `<div class="bar-fill" title="${CARDIO[a].name}: ${fmt(Math.round(by[a] * 10) / 10)} km" style="width:${by[a] / maxKm * 100}%;background:${cardioColor(a)};border-radius:0"></div>`).join("")}</div><span class="num" style="font-weight:700;text-align:right">${fmt(Math.round(total))} km</span>
      <span></span><span class="small muted" style="grid-column:2 / 4;margin-top:-4px">${CARDIO_ORDER.filter(a => by[a]).map(a => `${CARDIO[a].name} ${fmt(Math.round(by[a] * 10) / 10)} ${a === "swim" ? "km" : "km"}`).join(" · ")}</span></div>`).join("")}</div>
      <div class="legend">${CARDIO_ORDER.filter(a => kms.some(k => k.by[a])).map(a => `<span><i style="background:${cardioColor(a)}"></i>${CARDIO[a].name}</span>`).join("")}</div></div>` : ""}
    <h2>Gjengen</h2>
    <p class="small muted" style="margin-top:-4px">Fremgang siste 4 uker mot de 4 før, i prosent. Ingen vekter vises.</p>
    <div class="people">${ids.map(uid => { const p = S.profiles[uid], rp = recentProgress(uid), wk = weekCounts(uid, 8), mx = Math.max(1, ...wk.map(w => w.n));
      const top = MUSCLE_ORDER.filter(g => rp.groups[g].pct != null).sort((a, b) => rp.groups[b].pct - rp.groups[a].pct).slice(0, 3);
      const last4 = countedSessions(uid).filter(s => s.date >= addDays(todayISO(), -27)).length;
      return `<button class="person" data-person="${esc(uid)}">
        ${figureSVG(rp.groups, { build: p.build || 1, color: p.color, name: p.name, labels: false, title: "Muskelkart for " + p.name })}
        <span class="info">
          <span style="display:flex;align-items:center;gap:8px"><b style="font-family:var(--display);font-size:22px;text-transform:uppercase">${esc(p.name)}</b>${uid === S.me ? `<span class="small muted">(deg)</span>` : ""}</span>
          <span class="small muted">${last4} økter siste 4 uker${(() => { const k = kmInRange(uid, addDays(todayISO(), -27), todayISO()).total; return k ? ` · ${fmt(Math.round(k))} km` : ""; })()}</span>
          <span class="chips">${top.map(g => `<span class="chip ${statusOf(rp.groups[g].pct)}">${MUSCLES[g].name} ${pctText(rp.groups[g].pct)}</span>`).join("") || `<span class="small muted">Trenger 8 uker med data for prosent.</span>`}</span>
          <span class="mini-bars" role="img" aria-label="Økter per uke, siste 8 uker: ${wk.map(w => w.n).join(", ")}">${wk.map(w => `<i style="height:${Math.max(2, w.n / mx * 28)}px;background:${esc(p.color)};opacity:${w.n ? 1 : .25}"></i>`).join("")}</span>
        </span></button>`; }).join("")}</div>
    <h2>Rekorder</h2>
    ${feed.length ? `<div class="list feed">${feed.map(r => { const counts = reactCounts(r.key), mine = S.reactions[S.me]?.r?.[r.key], own = r.uid === S.me; return `
      <div class="feed-item"><div class="line">${avatar(r.uid)}<div><b>${esc(nameOf(r.uid))}</b> ${r.cardio ? `satte ny rekord: ${esc(r.label)}` : `satte ny rekord i ${esc(exMeta(r.uid, r.exId).name)}`}<div class="small muted">${dateLabel(r.date)}</div></div></div>
      <div class="reacts">${REACTIONS.map(e => { const who = counts[e] || []; const label = who.map(nameOf).join(", ");
        if (own) return who.length ? `<span class="react" title="${esc(label)}">${e} ${who.length}</span>` : "";
        return `<button class="react" data-key="${esc(r.key)}" data-e="${e}" aria-pressed="${mine === e}" aria-label="${e} ${who.length ? `(${who.length}: ${esc(label)})` : ""}" title="${esc(label)}">${e}${who.length ? " " + who.length : ""}</button>`; }).join("")}</div></div>`; }).join("")}</div>`
      : `<div class="empty">Rekorder fra hele gjengen dukker opp her. En rekord er når et løft slår alt du har gjort før i samme øvelse.</div>`}`;
  v.querySelectorAll("[data-person]").forEach(b => b.onclick = () => go({ v: "person", uid: b.dataset.person }));
  v.querySelectorAll(".react[data-key]").forEach(b => b.onclick = async () => {
    const r = { ...(S.reactions[S.me]?.r || {}) }; const k = b.dataset.key, e = b.dataset.e;
    if (r[k] === e) delete r[k]; else r[k] = e;
    S.reactions[S.me] = { r }; render(); await B.saveReactions({ r });
  });
}
function renderPerson(v, uid) {
  const p = S.profiles[uid]; if (!p) { back(); return; }
  const rp = recentProgress(uid);
  v.innerHTML = `
    <button class="back" id="back">← Gjengen</button>
    <div class="person-head" style="margin-top:4px">${avatar(uid)}<h3>${esc(p.name)}</h3></div>
    <div class="card" style="margin-top:12px"><div id="pfig">${figureSVG(rp.groups, { build: p.build || 1, color: p.color, name: p.name, interactive: true, title: "Muskelkart for " + p.name })}</div>${LEGEND}</div>
    <div style="margin-top:12px">${groupRows(rp.groups, true, uid)}</div>`;
  $("#back").onclick = back;
  bindFigure($("#pfig"), uid);
  v.querySelectorAll("button.row[data-g]").forEach(b => b.onclick = () => go({ v: "muscle", uid, g: b.dataset.g }));
}

// ---------- boot ----------
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { if (draft) save(); setTab(b.dataset.tab); });
// Arrow keys, Home and End move between tabs (WAI-ARIA tabs pattern, automatic activation).
$("#tabs").addEventListener("keydown", ev => {
  const tabs = [...document.querySelectorAll(".tabs button")], i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const j = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[ev.key];
  if (j == null) return; ev.preventDefault(); if (draft) save(); setTab(tabs[j].dataset.tab); tabs[j].focus();
});
$("#finish").onclick = finishSession;
$("#me-chip").onclick = () => { if (myProfile()) { setTab("min"); } };
window.addEventListener("pagehide", () => { if (draft) ls.set(bufKey(), JSON.stringify(draft)); });
document.documentElement.lang = LANG === "en" ? "en" : "no";
applyLangData();
if (DEMO) {
  $("#demo-bar").hidden = false; $("#demo-reset").onclick = () => DemoBackend.reset();
  const lb = $("#demo-lang"); lb.textContent = LANG === "en" ? "Norsk" : "English"; lb.setAttribute("lang", LANG === "en" ? "no" : "en");
  lb.onclick = () => { const next = LANG === "en" ? "no" : "en"; try { localStorage.setItem("loefteloggen-lang", next); } catch {} const u = new URL(location.href); u.searchParams.set("lang", next); location.href = u.href; };
  $("#demo-back").href = LANG === "en" ? "https://saetersdal.no/en/work/loefteloggen.html" : "https://saetersdal.no/work/loefteloggen.html";
}

let restoredOnce = false;
function onData(kind, uid) {
  if (kind === "error") { setStatus("Mistet forbindelsen"); return; }
  let restored = false;
  if (!draft && !restoredOnce && S.me && S.loadedMine) {
    restoredOnce = true;
    const act = ls.get(activeKey());
    if (act) {
      const s = sessionsOf(S.me).find(x => x.id === act);
      let buf = null; try { buf = JSON.parse(ls.get(bufKey()) || "null"); } catch {}
      if (buf && buf.id === act && (!s || (buf.updatedAt || "") >= (s.updatedAt || ""))) draft = buf;
      else if (s && !s.finishedAt) draft = JSON.parse(JSON.stringify(s));
      else ls.set(activeKey(), null);
      restored = !!draft;
    }
  }
  // Never redraw the logging screen from a snapshot: the draft in memory is the source of truth there.
  if (tab === "okt" && draft && !nav && !restored && kind !== "init") return;
  if (nav?.v === "tpl" && kind !== "profiles") return;
  setStatus(DEMO ? "Demo" : "Synkronisert");
  render();
}
render();
B.init(onData).then(r => { initResult = r; if (r !== "ok") setStatus("Ikke tilkoblet"); else setStatus(DEMO ? "Demo" : "Synkronisert"); render(); onData("init"); });
</script>
</body>
</html>
